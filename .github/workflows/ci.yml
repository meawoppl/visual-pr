name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # check_svg.py uses PEP 604 unions, so 3.10 is the floor.
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q

  lint:
    name: Lint workflows and the composite action's shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflow files)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: "shellcheck (the composite action's run block)"
        run: |
          python3 - <<'EOF'
          import pathlib
          text = pathlib.Path("action.yml").read_text().split("      run: |\n", 1)[1]
          body = "\n".join(l[8:] if l.startswith("        ") else l for l in text.splitlines())
          pathlib.Path("/tmp/action.bash").write_text("#!/usr/bin/env bash\n" + body + "\n")
          EOF
          shellcheck -s bash -S warning /tmp/action.bash

  action-self-test:
    name: Composite action end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valid SVG passes
        uses: ./
        with:
          pr-number: valid
          svg-dir: tests/fixtures

      - name: Missing SVG fails with fix instructions
        id: missing
        uses: ./
        continue-on-error: true
        with:
          pr-number: '999999'
          svg-dir: tests/fixtures
      - name: Off-palette SVG fails with fix instructions
        id: invalid
        uses: ./
        continue-on-error: true
        with:
          pr-number: off-palette
          svg-dir: tests/fixtures
          style: ''
          instructions: 'Repo-specific guidance appears here.'
      - name: Custom style file is honored
        uses: ./
        with:
          pr-number: red-100
          svg-dir: tests/fixtures
          style: tests/fixtures/style-red.json
          extra-args: --i-support-this-software
      - name: Bundled style name is honored (PR 412 -> 000412.svg)
        uses: ./
        with:
          pr-number: '412'
          svg-dir: examples/nord
          style: nord
      - name: Unknown style name fails
        id: badstyle
        uses: ./
        continue-on-error: true
        with:
          pr-number: valid
          svg-dir: tests/fixtures
          style: not-a-style

      - name: Assert outcomes
        # GITHUB_STEP_SUMMARY is a fresh file per step, so the recipe text is
        # asserted offline in tests/test_action.py; here we check the action's
        # outputs and exit statuses on a real runner.
        env:
          MISSING: ${{ steps.missing.outcome }}
          MISSING_OUT: ${{ steps.missing.outputs.outcome }}
          MISSING_SVG: ${{ steps.missing.outputs.svg }}
          INVALID: ${{ steps.invalid.outcome }}
          INVALID_OUT: ${{ steps.invalid.outputs.outcome }}
          BADSTYLE: ${{ steps.badstyle.outcome }}
          BADSTYLE_OUT: ${{ steps.badstyle.outputs.outcome }}
        run: |
          set -eu
          [ "$MISSING" = failure ]  && [ "$MISSING_OUT" = missing ]   || { echo "missing case: $MISSING/$MISSING_OUT"; exit 1; }
          [ "$MISSING_SVG" = tests/fixtures/999999.svg ]              || { echo "svg output: $MISSING_SVG"; exit 1; }
          [ "$INVALID" = failure ]  && [ "$INVALID_OUT" = invalid ]   || { echo "invalid case: $INVALID/$INVALID_OUT"; exit 1; }
          [ "$BADSTYLE" = failure ] && [ "$BADSTYLE_OUT" = bad-style ] || { echo "bad-style case: $BADSTYLE/$BADSTYLE_OUT"; exit 1; }
          echo "outcomes verified"
