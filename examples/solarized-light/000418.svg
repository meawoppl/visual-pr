<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <!-- Synthetic example PR for the visual-pr style matrix (examples/README.md).
       Authored in the default palette; examples/build.py re-skins it by palette index. -->
  <rect x="0" y="0" width="2000" height="1200" fill="#fdf6e3"/>
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#839496"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#268bd2"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#859900"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc322f"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cb4b16"/></marker>
  </defs>
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#839496">PR #418 · Acquire the cache lock before invalidating</text>
  <text x="55" y="100" font-size="34" fill="#073642">Two writers could race between cache.delete() and the DB commit, pinning a stale value;</text>
  <text x="55" y="140" font-size="34" fill="#073642">now invalidate() holds cache.lock(key) through commit, so no reader repopulates a pre-commit row.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#93a1a1" stroke-width="1"/>
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#dc322f">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#859900">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE: lifelines Writer A / Reader / Cache / DB -->
  <text x="140" y="262" font-size="24" fill="#268bd2" text-anchor="middle">Writer A</text>
  <line x1="140" y1="280" x2="140" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="400" y="262" font-size="24" fill="#268bd2" text-anchor="middle">Reader</text>
  <line x1="400" y1="280" x2="400" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="660" y="262" font-size="24" fill="#268bd2" text-anchor="middle">Cache</text>
  <line x1="660" y1="280" x2="660" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="880" y="262" font-size="24" fill="#268bd2" text-anchor="middle">DB</text>
  <line x1="880" y1="280" x2="880" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="134" y="315" width="12" height="310" fill="#eee8d5" stroke="#93a1a1" stroke-width="1.5"/>
  <rect x="394" y="385" width="12" height="170" fill="#eee8d5" stroke="#93a1a1" stroke-width="1.5"/>
  <line x1="146" y1="330" x2="660" y2="330" stroke="#657b83" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="403" y="320" font-size="22" fill="#657b83" text-anchor="middle">delete(k)</text>
  <line x1="406" y1="400" x2="660" y2="400" stroke="#657b83" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="533" y="390" font-size="22" fill="#657b83" text-anchor="middle">get(k) -> miss</text>
  <line x1="406" y1="470" x2="880" y2="470" stroke="#657b83" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="643" y="460" font-size="22" fill="#657b83" text-anchor="middle">SELECT ... (old row)</text>
  <line x1="406" y1="540" x2="660" y2="540" stroke="#dc322f" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="533" y="530" font-size="22" fill="#dc322f" text-anchor="middle">set(k, old)</text>
  <line x1="146" y1="610" x2="880" y2="610" stroke="#657b83" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="513" y="600" font-size="22" fill="#657b83" text-anchor="middle">COMMIT (new row)</text>
  <line x1="440" y1="700" x2="560" y2="700" stroke="#dc322f" stroke-width="3"/>
  <text x="500" y="745" font-size="23" fill="#dc322f" text-anchor="middle">cache holds old, DB holds new</text>
  <text x="500" y="777" font-size="22" fill="#839496" text-anchor="middle">nothing invalidates again until the next write</text>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#eee8d5" stroke="#dc322f" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#586e75">Stale read for the rest of the TTL</text>
    <text x="104" y="1046" font-size="23" fill="#dc322f">up to 1 h of wrong data after every concurrent write</text>
  </g>

  <!-- AFTER -->
  <text x="1125" y="262" font-size="24" fill="#268bd2" text-anchor="middle">Writer A</text>
  <line x1="1125" y1="280" x2="1125" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="1385" y="262" font-size="24" fill="#268bd2" text-anchor="middle">Reader</text>
  <line x1="1385" y1="280" x2="1385" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="1645" y="262" font-size="24" fill="#268bd2" text-anchor="middle">Cache</text>
  <line x1="1645" y1="280" x2="1645" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="1865" y="262" font-size="24" fill="#268bd2" text-anchor="middle">DB</text>
  <line x1="1865" y1="280" x2="1865" y2="930" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="1119" y="315" width="12" height="310" fill="#eee8d5" stroke="#859900" stroke-width="1.5"/>
  <rect x="1379" y="455" width="12" height="310" fill="#eee8d5" stroke="#93a1a1" stroke-width="1.5"/>
  <line x1="1131" y1="330" x2="1645" y2="330" stroke="#859900" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1388" y="320" font-size="22" fill="#859900" text-anchor="middle">lock(k)</text>
  <line x1="1131" y1="400" x2="1645" y2="400" stroke="#657b83" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="1388" y="390" font-size="22" fill="#657b83" text-anchor="middle">delete(k)</text>
  <line x1="1391" y1="470" x2="1645" y2="470" stroke="#cb4b16" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="1518" y="460" font-size="22" fill="#cb4b16" text-anchor="middle">get(k) blocks</text>
  <line x1="1131" y1="540" x2="1865" y2="540" stroke="#657b83" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="1498" y="530" font-size="22" fill="#657b83" text-anchor="middle">COMMIT (new row)</text>
  <line x1="1131" y1="610" x2="1645" y2="610" stroke="#859900" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1388" y="600" font-size="22" fill="#859900" text-anchor="middle">unlock(k)</text>
  <line x1="1391" y1="680" x2="1865" y2="680" stroke="#657b83" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="1628" y="670" font-size="22" fill="#657b83" text-anchor="middle">SELECT ... (new row)</text>
  <line x1="1391" y1="750" x2="1645" y2="750" stroke="#859900" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1518" y="740" font-size="22" fill="#859900" text-anchor="middle">set(k, new)</text>
  <g>
    <rect x="1065" y="810" width="860" height="100" fill="#eee8d5" stroke="#cb4b16" stroke-width="1.5"/>
    <text x="1089" y="850" font-size="24" fill="#cb4b16">Lock is best-effort with a 5 s TTL</text>
    <text x="1089" y="886" font-size="22" fill="#657b83">CACHE_LOCK_TTL = 5 - a crashed writer cannot wedge readers</text>
  </g>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#eee8d5" stroke="#859900" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#586e75">Readers repopulate only from committed rows</text>
    <text x="1089" y="1046" font-size="23" fill="#859900">no stale window; writers hold the lock ~2 ms longer</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#839496">Does not cover multi-key invalidation: callers touching several keys still lock and commit them one at a time.</text>
</svg>
