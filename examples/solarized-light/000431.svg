<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <!-- Synthetic example PR for the visual-pr style matrix (examples/README.md).
       Authored in the default palette; examples/build.py re-skins it by palette index. -->
  <rect x="0" y="0" width="2000" height="1200" fill="#fdf6e3"/>
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#839496"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#268bd2"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#859900"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc322f"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cb4b16"/></marker>
  </defs>
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#839496">PR #431 · Validate upload manifests before enqueueing</text>
  <text x="55" y="100" font-size="34" fill="#073642">Malformed manifests were accepted at POST /uploads and only failed inside the worker, hours later;</text>
  <text x="55" y="140" font-size="34" fill="#073642">now validate_manifest() runs in the request, so callers get a 422 naming the field instead of a stall.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#93a1a1" stroke-width="1"/>
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#dc322f">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#859900">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="250" width="860" height="110" fill="#eee8d5" stroke="#93a1a1" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#268bd2">UploadManifestView.post()</text>
    <text x="104" y="330" font-size="23" fill="#657b83">json.loads(body) → enqueue(ManifestJob) with no schema check</text>
  </g>
  <text x="104" y="430" font-size="26" font-weight="700" fill="#dc322f">–</text>
  <text x="144" y="430" font-size="23" fill="#657b83">size may be negative, or a string</text>
  <text x="104" y="490" font-size="26" font-weight="700" fill="#dc322f">–</text>
  <text x="144" y="490" font-size="23" fill="#657b83">checksum never matched against a sha256 pattern</text>
  <text x="104" y="550" font-size="26" font-weight="700" fill="#dc322f">–</text>
  <text x="144" y="550" font-size="23" fill="#657b83">duplicate paths (after normpath) accepted</text>
  <text x="104" y="610" font-size="26" font-weight="700" fill="#dc322f">–</text>
  <text x="144" y="610" font-size="23" fill="#657b83">unknown content_type passes through</text>
  <text x="104" y="670" font-size="26" font-weight="700" fill="#dc322f">–</text>
  <text x="144" y="670" font-size="23" fill="#dc322f">errors surface as KeyError in ManifestWorker.run()</text>
  <line x1="450" y1="760" x2="570" y2="760" stroke="#dc322f" stroke-width="3"/>
  <text x="510" y="805" font-size="23" fill="#dc322f" text-anchor="middle">failure discovered ~3 h later, in the worker</text>
  <text x="510" y="837" font-size="22" fill="#839496" text-anchor="middle">the caller already received 202 Accepted</text>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#eee8d5" stroke="#dc322f" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#586e75">Bad upload silently stalls until the worker dies</text>
    <text x="104" y="1046" font-size="23" fill="#dc322f">no field, no reason, nothing for the client to fix</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1065" y="250" width="860" height="110" fill="#eee8d5" stroke="#859900" stroke-width="2"/>
    <text x="1089" y="290" font-size="26" fill="#268bd2">UploadManifestView.post()</text>
    <text x="1089" y="330" font-size="23" fill="#657b83">validate_manifest(payload) before enqueue(ManifestJob)</text>
  </g>
  <text x="1089" y="430" font-size="26" font-weight="700" fill="#859900">✓</text>
  <text x="1129" y="430" font-size="23" fill="#657b83">size: int and 0 ≤ size ≤ MAX_UPLOAD_BYTES</text>
  <text x="1089" y="490" font-size="26" font-weight="700" fill="#859900">✓</text>
  <text x="1129" y="490" font-size="23" fill="#657b83">checksum: re.fullmatch(r'[a-f0-9]{64}')</text>
  <text x="1089" y="550" font-size="26" font-weight="700" fill="#859900">✓</text>
  <text x="1129" y="550" font-size="23" fill="#657b83">paths: unique after os.path.normpath()</text>
  <text x="1089" y="610" font-size="26" font-weight="700" fill="#859900">✓</text>
  <text x="1129" y="610" font-size="23" fill="#657b83">content_type in ALLOWED_TYPES</text>
  <text x="1089" y="670" font-size="26" font-weight="700" fill="#859900">✓</text>
  <text x="1129" y="670" font-size="23" fill="#859900">any miss → raise ManifestError(field, reason)</text>
  <g>
    <rect x="1065" y="740" width="860" height="100" fill="#eee8d5" stroke="#cb4b16" stroke-width="1.5"/>
    <text x="1089" y="780" font-size="24" fill="#cb4b16">Legacy clients: X-Manifest-Version &lt; 2</text>
    <text x="1089" y="816" font-size="22" fill="#657b83">content_type check skipped until 2026-12-01, then hard-fail</text>
  </g>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#eee8d5" stroke="#859900" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#586e75">422 Unprocessable Entity at request time</text>
    <text x="1089" y="1046" font-size="23" fill="#859900">{"field": "checksum", "reason": "not a sha256 hex digest"}</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#839496">Structural only: it does not verify the checksum against the uploaded bytes — ManifestWorker still does that later.</text>
</svg>
