<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <!-- Synthetic example PR for the visual-pr style matrix (examples/README.md).
       Authored in the default palette; examples/build.py re-skins it by palette index. -->
  <rect x="0" y="0" width="2000" height="1200" fill="#ffffff"/>
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#656d76">PR #437 · Stream CSV exports instead of buffering them in memory</text>
  <text x="55" y="100" font-size="34" fill="#0a0c10">export_csv() built the whole file in a StringIO, so a 2M-row report needed ~1.8 GB and got OOM-killed;</text>
  <text x="55" y="140" font-size="34" fill="#0a0c10">now rows stream through StreamingHttpResponse in 5k-row chunks, so memory stays flat at ~40 MB.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#cf222e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#1a7f37">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="250" width="560" height="150" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#0969da">ReportExportView.get()</text>
    <text x="104" y="330" font-size="23" fill="#424a53">rows = list(ReportQuery.iterator())</text>
    <text x="104" y="366" font-size="22" fill="#656d76">every row materialised before the first byte</text>
  </g>
  <line x1="360" y1="400" x2="360" y2="490" stroke="#656d76" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="376" y="450" font-size="22" fill="#656d76">2M Row objects</text>
  <g>
    <rect x="80" y="495" width="560" height="160" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/>
    <text x="104" y="535" font-size="26" fill="#1f2328">StringIO buffer</text>
    <text x="104" y="575" font-size="23" fill="#424a53">csv.writer(buf).writerows(rows)</text>
    <text x="104" y="611" font-size="22" fill="#656d76">HttpResponse(buf.getvalue(), text/csv)</text>
  </g>
  <line x1="360" y1="655" x2="360" y2="735" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="300" y1="750" x2="420" y2="750" stroke="#cf222e" stroke-width="3"/>
  <text x="360" y="795" font-size="23" fill="#cf222e" text-anchor="middle">RSS grows ~900 B per row</text>
  <text x="360" y="827" font-size="22" fill="#656d76" text-anchor="middle">2M rows ≈ 1.8 GB against a 2 GiB pod limit</text>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#1f2328">OOMKilled at ~1.4M rows</text>
    <text x="104" y="1046" font-size="23" fill="#cf222e">export dies after ~90 s with no partial output</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1065" y="250" width="560" height="150" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="1089" y="290" font-size="26" fill="#0969da">ReportExportView.get()</text>
    <text x="1089" y="330" font-size="23" fill="#424a53">ReportQuery.iterator(chunk_size=5000)</text>
    <text x="1089" y="366" font-size="22" fill="#656d76">server-side cursor; nothing held up front</text>
  </g>
  <line x1="1345" y1="400" x2="1345" y2="490" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1361" y="450" font-size="22" fill="#1a7f37">5 000 rows at a time</text>
  <g>
    <rect x="1065" y="495" width="620" height="160" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
    <text x="1089" y="535" font-size="26" fill="#1a7f37">stream_rows()</text>
    <text x="1089" y="575" font-size="23" fill="#424a53">yield csv.writer(Echo()).writerow(row) per row</text>
    <text x="1089" y="611" font-size="22" fill="#656d76">StreamingHttpResponse(stream_rows(), text/csv)</text>
  </g>
  <line x1="1345" y1="655" x2="1345" y2="700" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <g>
    <rect x="1065" y="705" width="620" height="100" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.5"/>
    <text x="1089" y="745" font-size="24" fill="#bc4c00">No Content-Length; chunked transfer</text>
    <text x="1089" y="781" font-size="22" fill="#424a53">nginx: proxy_buffering off for /exports/</text>
  </g>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#1f2328">Flat ~40 MB RSS regardless of row count</text>
    <text x="1089" y="1046" font-size="23" fill="#1a7f37">first bytes in &lt; 200 ms; 2M rows complete in ~70 s</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#656d76">An error mid-export now yields a truncated file with a 200 status; clients must check the trailing row-count line.</text>
</svg>
