<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <!-- Synthetic example PR for the visual-pr style matrix (examples/README.md).
       Authored in the default palette; examples/build.py re-skins it by palette index. -->
  <rect x="0" y="0" width="2000" height="1200" fill="#2e3440"/>
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#616e88"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#81a1c1"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3be8c"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf616a"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d08770"/></marker>
  </defs>
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#616e88">PR #431 · Validate upload manifests before enqueueing</text>
  <text x="55" y="100" font-size="34" fill="#eceff4">Malformed manifests were accepted at POST /uploads and only failed inside the worker, hours later;</text>
  <text x="55" y="140" font-size="34" fill="#eceff4">now validate_manifest() runs in the request, so callers get a 422 naming the field instead of a stall.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#4c566a" stroke-width="1"/>
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#bf616a">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#a3be8c">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#4c566a" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="250" width="860" height="110" fill="#3b4252" stroke="#4c566a" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#81a1c1">UploadManifestView.post()</text>
    <text x="104" y="330" font-size="23" fill="#d8dee9">json.loads(body) -> enqueue(ManifestJob) with no schema check</text>
  </g>
  <text x="104" y="430" font-size="26" font-weight="700" fill="#bf616a">-</text>
  <text x="144" y="430" font-size="23" fill="#d8dee9">size may be negative, or a string</text>
  <text x="104" y="490" font-size="26" font-weight="700" fill="#bf616a">-</text>
  <text x="144" y="490" font-size="23" fill="#d8dee9">checksum never matched against a sha256 pattern</text>
  <text x="104" y="550" font-size="26" font-weight="700" fill="#bf616a">-</text>
  <text x="144" y="550" font-size="23" fill="#d8dee9">duplicate paths (after normpath) accepted</text>
  <text x="104" y="610" font-size="26" font-weight="700" fill="#bf616a">-</text>
  <text x="144" y="610" font-size="23" fill="#d8dee9">unknown content_type passes through</text>
  <text x="104" y="670" font-size="26" font-weight="700" fill="#bf616a">-</text>
  <text x="144" y="670" font-size="23" fill="#bf616a">errors surface as KeyError in ManifestWorker.run()</text>
  <line x1="450" y1="760" x2="570" y2="760" stroke="#bf616a" stroke-width="3"/>
  <text x="510" y="805" font-size="23" fill="#bf616a" text-anchor="middle">failure discovered ~3 h later, in the worker</text>
  <text x="510" y="837" font-size="22" fill="#616e88" text-anchor="middle">the caller already received 202 Accepted</text>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#3b4252" stroke="#bf616a" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#e5e9f0">Bad upload silently stalls until the worker dies</text>
    <text x="104" y="1046" font-size="23" fill="#bf616a">no field, no reason, nothing for the client to fix</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1065" y="250" width="860" height="110" fill="#3b4252" stroke="#a3be8c" stroke-width="2"/>
    <text x="1089" y="290" font-size="26" fill="#81a1c1">UploadManifestView.post()</text>
    <text x="1089" y="330" font-size="23" fill="#d8dee9">validate_manifest(payload) before enqueue(ManifestJob)</text>
  </g>
  <text x="1089" y="430" font-size="26" font-weight="700" fill="#a3be8c">+</text>
  <text x="1129" y="430" font-size="23" fill="#d8dee9">size: int and 0 &lt;= size &lt;= MAX_UPLOAD_BYTES</text>
  <text x="1089" y="490" font-size="26" font-weight="700" fill="#a3be8c">+</text>
  <text x="1129" y="490" font-size="23" fill="#d8dee9">checksum: re.fullmatch(r'[a-f0-9]{64}')</text>
  <text x="1089" y="550" font-size="26" font-weight="700" fill="#a3be8c">+</text>
  <text x="1129" y="550" font-size="23" fill="#d8dee9">paths: unique after os.path.normpath()</text>
  <text x="1089" y="610" font-size="26" font-weight="700" fill="#a3be8c">+</text>
  <text x="1129" y="610" font-size="23" fill="#d8dee9">content_type in ALLOWED_TYPES</text>
  <text x="1089" y="670" font-size="26" font-weight="700" fill="#a3be8c">+</text>
  <text x="1129" y="670" font-size="23" fill="#a3be8c">any miss -> raise ManifestError(field, reason)</text>
  <g>
    <rect x="1065" y="740" width="860" height="100" fill="#3b4252" stroke="#d08770" stroke-width="1.5"/>
    <text x="1089" y="780" font-size="24" fill="#d08770">Legacy clients: X-Manifest-Version &lt; 2</text>
    <text x="1089" y="816" font-size="22" fill="#d8dee9">content_type check skipped until 2026-12-01, then hard-fail</text>
  </g>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#3b4252" stroke="#a3be8c" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#e5e9f0">422 Unprocessable Entity at request time</text>
    <text x="1089" y="1046" font-size="23" fill="#a3be8c">{"field": "checksum", "reason": "not a sha256 hex digest"}</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#616e88">Structural only: it does not verify the checksum against the uploaded bytes - ManifestWorker still does that later.</text>
</svg>
