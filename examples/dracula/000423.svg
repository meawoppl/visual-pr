<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <!-- Synthetic example PR for the visual-pr style matrix (examples/README.md).
       Authored in the default palette; examples/build.py re-skins it by palette index. -->
  <rect x="0" y="0" width="2000" height="1200" fill="#282a36"/>
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6272a4"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bd93f9"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#50fa7b"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5555"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb86c"/></marker>
  </defs>
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#6272a4">PR #423 · Shorten session TTL to 24 h with sliding refresh</text>
  <text x="55" y="100" font-size="34" fill="#ffffff">Session tokens lived 30 days from issue regardless of use, so a leaked token stayed valid for weeks;</text>
  <text x="55" y="140" font-size="34" fill="#ffffff">now TTL is 24 h and refresh_session() extends it on activity, so idle tokens die within a day.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#44475a" stroke-width="1"/>
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#ff5555">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#50fa7b">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#44475a" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="250" width="560" height="130" fill="#343746" stroke="#44475a" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#bd93f9">SessionToken</text>
    <text x="104" y="328" font-size="23" fill="#bfc7d5">expires_at = issued_at + 30 days</text>
    <text x="104" y="362" font-size="22" fill="#6272a4">SESSION_TTL_DAYS = 30, never refreshed</text>
  </g>
  <text x="100" y="530" font-size="22" fill="#bd93f9">issued</text>
  <text x="153" y="490" font-size="22" fill="#6272a4">last activity · day 2</text>
  <text x="340" y="530" font-size="22" fill="#ff5555">leaked · day 9</text>
  <text x="900" y="530" font-size="22" fill="#6272a4" text-anchor="end">expires · day 30</text>
  <rect x="100" y="560" width="800" height="30" fill="#343746" stroke="#44475a" stroke-width="1.5"/>
  <rect x="340" y="560" width="560" height="30" fill="#343746" stroke="#ff5555" stroke-width="2"/>
  <line x1="100" y1="600" x2="900" y2="600" stroke="#6272a4" stroke-width="1.5"/>
  <line x1="153" y1="545" x2="153" y2="560" stroke="#6272a4" stroke-width="1.5"/>
  <line x1="340" y1="545" x2="340" y2="560" stroke="#ff5555" stroke-width="1.5"/>
  <text x="100" y="630" font-size="21" fill="#6272a4" text-anchor="middle">day 0</text>
  <text x="366" y="630" font-size="21" fill="#6272a4" text-anchor="middle">day 10</text>
  <text x="633" y="630" font-size="21" fill="#6272a4" text-anchor="middle">day 20</text>
  <text x="900" y="630" font-size="21" fill="#6272a4" text-anchor="middle">day 30</text>
  <line x1="560" y1="690" x2="680" y2="690" stroke="#ff5555" stroke-width="3"/>
  <text x="620" y="735" font-size="23" fill="#ff5555" text-anchor="middle">21 days of valid, leaked token</text>
  <text x="620" y="767" font-size="22" fill="#6272a4" text-anchor="middle">owner stopped using it on day 2</text>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#343746" stroke="#ff5555" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#f8f8f2">Leaked or forgotten tokens stay valid for weeks</text>
    <text x="104" y="1046" font-size="23" fill="#ff5555">revocation needs a manual DELETE FROM sessions</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1065" y="250" width="560" height="130" fill="#343746" stroke="#50fa7b" stroke-width="2"/>
    <text x="1089" y="290" font-size="26" fill="#bd93f9">SessionToken</text>
    <text x="1089" y="328" font-size="23" fill="#bfc7d5">expires_at = last_seen_at + 24 h</text>
    <text x="1089" y="362" font-size="22" fill="#50fa7b">refresh_session() bumps it on each request</text>
  </g>
  <text x="1085" y="530" font-size="22" fill="#bd93f9">issued</text>
  <text x="1235" y="490" font-size="22" fill="#50fa7b">last activity · 9 h → +24 h</text>
  <text x="1635" y="530" font-size="22" fill="#50fa7b">expired · 33 h</text>
  <rect x="1085" y="560" width="550" height="30" fill="#343746" stroke="#50fa7b" stroke-width="2"/>
  <line x1="1085" y1="600" x2="1885" y2="600" stroke="#6272a4" stroke-width="1.5"/>
  <line x1="1118" y1="545" x2="1118" y2="560" stroke="#50fa7b" stroke-width="1.5"/>
  <line x1="1168" y1="545" x2="1168" y2="560" stroke="#50fa7b" stroke-width="1.5"/>
  <line x1="1235" y1="545" x2="1235" y2="560" stroke="#50fa7b" stroke-width="1.5"/>
  <line x1="1635" y1="545" x2="1635" y2="560" stroke="#50fa7b" stroke-width="1.5"/>
  <text x="1085" y="630" font-size="21" fill="#6272a4" text-anchor="middle">0 h</text>
  <text x="1285" y="630" font-size="21" fill="#6272a4" text-anchor="middle">12 h</text>
  <text x="1485" y="630" font-size="21" fill="#6272a4" text-anchor="middle">24 h</text>
  <text x="1685" y="630" font-size="21" fill="#6272a4" text-anchor="middle">36 h</text>
  <text x="1885" y="630" font-size="21" fill="#6272a4" text-anchor="middle">48 h</text>
  <line x1="1425" y1="690" x2="1545" y2="690" stroke="#50fa7b" stroke-width="3"/>
  <text x="1485" y="735" font-size="23" fill="#50fa7b" text-anchor="middle">a leaked idle token dies in ≤ 24 h</text>
  <text x="1485" y="767" font-size="22" fill="#6272a4" text-anchor="middle">active users never notice: each request slides the window</text>
  <g>
    <rect x="1065" y="810" width="860" height="100" fill="#343746" stroke="#ffb86c" stroke-width="1.5"/>
    <text x="1089" y="850" font-size="24" fill="#ffb86c">Absolute cap: SESSION_MAX_AGE = 7 days</text>
    <text x="1089" y="886" font-size="22" fill="#bfc7d5">sliding refresh cannot extend a session past 7 days from issue</text>
  </g>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#343746" stroke="#50fa7b" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#f8f8f2">Idle sessions expire within a day</text>
    <text x="1089" y="1046" font-size="23" fill="#50fa7b">leaked tokens lose value fast; active users stay signed in</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#6272a4">Does not revoke tokens issued before the deploy: existing 30-day sessions age out naturally over the following month.</text>
</svg>
