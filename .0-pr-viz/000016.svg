<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #0016 · body-image: verify the permalink serves the validated SVG, not just its shape</text>

  <!-- Thesis -->
  <text x="55" y="100" font-size="34" fill="#e6e9f5">A permalink with the right shape passed even when its SHA never existed (#15);</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now the action looks the commit up and requires the very blob it just validated.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE ==================== -->
  <g>
    <rect x="80" y="250" width="860" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#c0caf5">PR description, first line</text>
    <text x="104" y="332" font-size="22" fill="#a9b1d6">![Visual summary](raw.githubusercontent.com/O/R/c892a106.../002002.svg)</text>
  </g>

  <line x1="510" y1="370" x2="510" y2="432" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>

  <g>
    <rect x="80" y="440" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="482" font-size="26" fill="#7aa2f7">pr_body_image.check(body, svg_path, mode, repos)</text>
    <text x="104" y="522" font-size="23" fill="#a9b1d6">ref_of() + pin_problem(): 40 hex chars, GitHub host, head or base repo</text>
    <text x="104" y="558" font-size="22" fill="#565f89">judges the URL's shape offline; nothing ever asks GitHub</text>
  </g>

  <line x1="510" y1="590" x2="510" y2="652" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>

  <g>
    <rect x="80" y="660" width="860" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="702" font-size="26" fill="#c0caf5">"PR description opens with an image of .0-pr-viz/002002.svg"</text>
    <text x="104" y="742" font-size="22" fill="#a9b1d6">outcome=passed -- the check is green</text>
  </g>

  <line x1="510" y1="780" x2="510" y2="842" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="850" width="860" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="892" font-size="26" fill="#f7768e">reviewer opens the PR: broken image</text>
    <text x="104" y="932" font-size="23" fill="#a9b1d6">c892a106... is not a commit in that repo; the raw URL is HTTP 404</text>
    <text x="104" y="968" font-size="22" fill="#565f89">agent-portal#2002: green check, dead picture, nobody told the author</text>
  </g>

  <text x="80" y="1060" font-size="22" fill="#a9b1d6">Same green for a SHA that exists but carries an older 002002.svg:</text>
  <text x="80" y="1094" font-size="22" fill="#f7768e">the picture on top is not the one the job just validated.</text>

  <!-- ==================== AFTER ==================== -->
  <g>
    <rect x="1065" y="250" width="860" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="292" font-size="26" fill="#c0caf5">PR description, first line</text>
    <text x="1089" y="332" font-size="22" fill="#a9b1d6">![Visual summary](raw.githubusercontent.com/O/R/c892a106.../002002.svg)</text>
  </g>

  <line x1="1495" y1="370" x2="1495" y2="432" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>

  <g>
    <rect x="1065" y="440" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="482" font-size="26" fill="#7aa2f7">pr_body_image.accepted(...) with --print-pin</text>
    <text x="1089" y="522" font-size="23" fill="#a9b1d6">same shape test, then a second stdout line: "pin: O/R c892a106..."</text>
    <text x="1089" y="558" font-size="22" fill="#565f89">still offline and dependency-free; it names the permalink it accepted</text>
  </g>

  <line x1="1495" y1="590" x2="1495" y2="652" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="660" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="702" font-size="26" fill="#9ece6a">action.yml: gh api repos/O/R/contents/&lt;svg&gt;?ref=&lt;sha&gt; --jq .sha</text>
    <text x="1089" y="742" font-size="23" fill="#a9b1d6">the job's token, so private repos work where a bare raw fetch would not</text>
    <text x="1089" y="778" font-size="22" fill="#565f89">compared with git hash-object of the file this job just validated</text>
  </g>

  <line x1="1495" y1="810" x2="1495" y2="842" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="850" width="860" height="230" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="890" font-size="23" fill="#f7768e">HTTP 404          -> body-image-missing: "404s ... re-pin to &lt;head sha&gt;"</text>
    <text x="1089" y="930" font-size="23" fill="#f7768e">blob differs      -> body-image-missing: "older ... than this PR's head"</text>
    <text x="1089" y="970" font-size="23" fill="#9ece6a">blob equal        -> passed; an older commit with the same bytes is fine</text>
    <text x="1089" y="1010" font-size="23" fill="#e0af68">other API error   -> ::warning::, passed on shape alone</text>
    <text x="1089" y="1050" font-size="22" fill="#565f89">the recipe prints the gh api / git hash-object pair to run locally</text>
  </g>

  <!-- Footer -->
  <text x="55" y="1172" font-size="22" fill="#565f89">Only a definite 404 fails; an outage or rate limit passes with a warning. Merged descriptions are never re-checked; the sweep is unchanged.</text>
</svg>
