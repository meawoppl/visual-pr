<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #0012 · body-image: require a commit permalink, not a branch URL</text>

  <!-- Thesis -->
  <text x="55" y="100" font-size="34" fill="#e6e9f5">points_at() matched the path and ignored the rest of the URL, so a branch-pinned</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">image passed green and 404'd at merge; now only a 40-char SHA permalink passes.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE ==================== -->
  <g>
    <rect x="80" y="250" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">pr_body_image.points_at(url, svg_path)</text>
    <text x="104" y="332" font-size="23" fill="#a9b1d6">return bare.endswith("/" + svg_path) -- the whole test</text>
    <text x="104" y="368" font-size="22" fill="#565f89">host, ref and repository are never read</text>
  </g>

  <line x1="510" y1="400" x2="510" y2="462" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>

  <text x="80" y="508" font-size="23" fill="#c0caf5">every one of these was accepted:</text>

  <text x="104" y="556" font-size="22" fill="#a9b1d6">raw.githubusercontent.com/O/R/feature-x/000412.svg</text>
  <text x="936" y="556" font-size="22" fill="#f7768e" text-anchor="end">404 at merge</text>

  <text x="104" y="596" font-size="22" fill="#a9b1d6">github.com/O/R/blob/docs/my-feature/000412.svg</text>
  <text x="936" y="596" font-size="22" fill="#f7768e" text-anchor="end">404 already</text>

  <text x="104" y="636" font-size="22" fill="#a9b1d6">raw.githubusercontent.com/someone/else/SHA/000412.svg</text>
  <text x="936" y="636" font-size="22" fill="#f7768e" text-anchor="end">wrong repo</text>

  <text x="104" y="676" font-size="22" fill="#a9b1d6">httpsnotevenaurl/.0-pr-viz/000412.svg</text>
  <text x="936" y="676" font-size="22" fill="#f7768e" text-anchor="end">not a URL</text>

  <line x1="104" y1="706" x2="936" y2="706" stroke="#3d4666" stroke-width="1"/>

  <g>
    <rect x="80" y="740" width="860" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="782" font-size="24" fill="#f7768e">the check is green, the image is broken</text>
    <text x="104" y="820" font-size="22" fill="#a9b1d6">and nothing tells the author: the URL matched, so the job passed</text>
    <text x="104" y="856" font-size="22" fill="#a9b1d6">the rot surfaces in review, or quietly after the merge</text>
  </g>

  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">tracking-test-bench: 4 of 7 descriptions show a dead image</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">two of them lost the branch their URL named when it merged</text>
  </g>

  <!-- ==================== AFTER ==================== -->
  <g>
    <rect x="1065" y="250" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="292" font-size="26" fill="#9ece6a">pr_body_image.pin_problem(url, svg_path, repos)</text>
    <text x="1089" y="332" font-size="23" fill="#a9b1d6">ref_of() splits host, repo and ref; ref must be 40 hex chars</text>
    <text x="1089" y="368" font-size="22" fill="#565f89">repo must be the PR's head or base; points_at() stays loose for the sweep</text>
  </g>

  <line x1="1495" y1="400" x2="1495" y2="462" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <text x="1065" y="508" font-size="23" fill="#c0caf5">verdict, with the reason printed to the author:</text>

  <text x="1089" y="556" font-size="22" fill="#a9b1d6">raw.githubusercontent.com/O/R/&lt;40-char sha&gt;/000412.svg</text>
  <text x="1921" y="556" font-size="22" fill="#9ece6a" text-anchor="end">accepted</text>

  <text x="1089" y="596" font-size="22" fill="#a9b1d6">github.com/O/R/blob/&lt;40-char sha&gt;/000412.svg</text>
  <text x="1921" y="596" font-size="22" fill="#9ece6a" text-anchor="end">accepted</text>

  <text x="1089" y="636" font-size="22" fill="#a9b1d6">pinned to 'feature-x', not a 40-character commit SHA</text>
  <text x="1921" y="636" font-size="22" fill="#f7768e" text-anchor="end">rejected</text>

  <text x="1089" y="676" font-size="22" fill="#a9b1d6">points at someone/else, not acme/widgets</text>
  <text x="1921" y="676" font-size="22" fill="#f7768e" text-anchor="end">rejected</text>

  <line x1="1089" y1="706" x2="1921" y2="706" stroke="#3d4666" stroke-width="1"/>

  <g>
    <rect x="1065" y="740" width="860" height="150" fill="#1e202e" stroke="#e0af68" stroke-width="1.5"/>
    <text x="1089" y="782" font-size="24" fill="#e0af68">both GitHub hosts stay legal</text>
    <text x="1089" y="820" font-size="22" fill="#a9b1d6">a private repo's raw URL 404s without a token, so its readers may need</text>
    <text x="1089" y="856" font-size="22" fill="#a9b1d6">the github.com form; the check does not take that option away</text>
  </g>

  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">the picture outlives the branch that carried it</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">a passing PR now looks different, so this is a new major</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Offline check: it never fetches the URL, so a permalink to a SHA that was never pushed still passes. Merged descriptions are never re-checked.</text>
</svg>
