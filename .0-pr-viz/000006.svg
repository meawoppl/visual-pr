<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#565f89"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/></marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0af68"/></marker>
  </defs>
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #6 · Weekly sweep on this repo; verify permalinks and descriptions before deleting</text>
  <text x="55" y="100" font-size="34" fill="#e6e9f5">sweep_merged.py patched a description and deleted the file on the strength of one API lookup;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now it fetches the permalink and re-reads the description first, and sweep.yml proves it weekly.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE: sequence — sweep / GitHub API / raw CDN / git -->
  <text x="140" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">sweep</text>
  <text x="420" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">GitHub API</text>
  <text x="680" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">raw CDN</text>
  <text x="880" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">git</text>
  <line x1="140" y1="280" x2="140" y2="880" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="420" y1="280" x2="420" y2="880" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="680" y1="280" x2="680" y2="880" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="880" y1="280" x2="880" y2="880" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="146" y1="330" x2="420" y2="330" stroke="#a9b1d6" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="283" y="320" font-size="22" fill="#a9b1d6" text-anchor="middle">contents?ref=sha</text>
  <line x1="146" y1="400" x2="420" y2="400" stroke="#a9b1d6" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="283" y="390" font-size="22" fill="#a9b1d6" text-anchor="middle">PATCH body</text>
  <line x1="146" y1="470" x2="880" y2="470" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="513" y="460" font-size="22" fill="#f7768e" text-anchor="middle">git rm 00000n.svg</text>
  <text x="680" y="560" font-size="22" fill="#565f89" text-anchor="middle">never asked</text>
  <line x1="450" y1="640" x2="570" y2="640" stroke="#f7768e" stroke-width="3"/>
  <text x="510" y="685" font-size="23" fill="#f7768e" text-anchor="middle">a 404 permalink or a swallowed PATCH → picture gone</text>
  <text x="510" y="717" font-size="22" fill="#565f89" text-anchor="middle">API says the blob exists; nobody checked the URL people click</text>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">Deletion trusted; verified only by the next person to look</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">and the tool had never run against real GitHub end to end</text>
  </g>

  <!-- AFTER -->
  <text x="1125" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">sweep</text>
  <text x="1405" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">GitHub API</text>
  <text x="1665" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">raw CDN</text>
  <text x="1865" y="262" font-size="24" fill="#7aa2f7" text-anchor="middle">git</text>
  <line x1="1125" y1="280" x2="1125" y2="770" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="1405" y1="280" x2="1405" y2="770" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="1665" y1="280" x2="1665" y2="770" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="1865" y1="280" x2="1865" y2="770" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="1131" y1="330" x2="1405" y2="330" stroke="#a9b1d6" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="1268" y="320" font-size="22" fill="#a9b1d6" text-anchor="middle">contents?ref=sha</text>
  <line x1="1131" y1="400" x2="1665" y2="400" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1398" y="390" font-size="22" fill="#9ece6a" text-anchor="middle">url_ok: GET permalink → 200, bytes start with '&lt;'</text>
  <line x1="1131" y1="470" x2="1405" y2="470" stroke="#a9b1d6" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="1268" y="460" font-size="22" fill="#a9b1d6" text-anchor="middle">PATCH body</text>
  <line x1="1131" y1="540" x2="1405" y2="540" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1268" y="530" font-size="22" fill="#9ece6a" text-anchor="middle">GET pulls/n: body has the permalink?</text>
  <line x1="1131" y1="610" x2="1865" y2="610" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1498" y="600" font-size="22" fill="#9ece6a" text-anchor="middle">only now: git rm 00000n.svg + ARCHIVE.md row</text>
  <text x="1498" y="680" font-size="22" fill="#565f89" text-anchor="middle">either check failing → "kept"; --no-verify-urls for offline tests</text>
  <g>
    <rect x="1065" y="810" width="860" height="110" fill="#1e202e" stroke="#e0af68" stroke-width="1.5"/>
    <text x="1089" y="850" font-size="24" fill="#e0af68">sweep.yml — Mondays 06:17 UTC and on dispatch</text>
    <text x="1089" y="886" font-size="22" fill="#a9b1d6">pytest tests/test_sweep.py → dry run → real sweep → no-visual PR</text>
  </g>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">Nothing is deleted until the link people click serves the SVG</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">and the tool proves itself against real GitHub every week</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">The weekly PR is opened with GITHUB_TOKEN, so no checks run on it; the job that opened it already ran the tests. A PAT would change that.</text>
</svg>
